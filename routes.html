const map=L.map('map');
// Basemap: Esri (keyless, embedding permitted). tile.openstreetmap.org was blocked
// by OSM's tile usage policy — a volunteer service, not for embedded apps.
const ESRI='https://server.arcgisonline.com/ArcGIS/rest/services/';
const baseStreet=L.tileLayer(ESRI+'World_Street_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), MapmyIndia, &copy; OpenStreetMap contributors'});
const baseSat=L.tileLayer(ESRI+'World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:'Tiles &copy; Esri — Source: Esri, i-cubed, USDA, USGS, AEX, GeoEye, Getmapping, Aerogrid, IGN, IGP, UPR-EGP and the GIS User Community'});
const baseLabels=L.tileLayer(ESRI+'Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}',{maxZoom:19,attribution:''});
baseStreet.addTo(map);
L.control.layers({'Street map':baseStreet,'Satellite':L.layerGroup([baseSat,baseLabels])},null,{position:'bottomleft'}).addTo(map);
const col=p=>p.days==null?'#e34948':p.days>365?'#eb6834':p.days>183?'#eda100':'#bbb';
const layer=L.layerGroup().addTo(map);const routeLayer=L.layerGroup().addTo(map);
const cols=['#1f5f8b','#4a3aa7','#1baf7a','#e87ba4','#008300'];
function drawSite(s){layer.clearLayers();routeLayer.clearLayers();const R=ROUTES[s];

// ---- water point popup: photograph, people served, and links into mWater ----
const MWR='https://portal.mwater.co/#/responses/';
const IMG='https://api.mwater.co/v3/images/';
const esc=t=>String(t??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const STATUS={ok:'working',down:'reported down',partial:'partially working',unknown:'no record in 2026'};
function popupHtml(p){
 const x=XTRA[p.wp]||{};
 const bits=[];
 if(x.ph) bits.push(`<img class="pp-img" loading="lazy" alt="Water point ${esc(p.wp)}" src="${IMG}${x.ph}">`);
 bits.push(`<div class="pp-b"><div class="pp-h">${esc(p.fkt)}, ${esc(p.commune)}</div>`);
 bits.push(`<div class="pp-c">water point <b>${esc(p.wp)}</b>${x.t?' · '+esc(x.t):''}</div>`);
 if(x.u!=null) bits.push(`<div class="pp-k"><b>${x.u.toLocaleString('en-GB')}</b> people served <span class="pp-m">(WorldPop, capped)</span></div>`);
 const days = p.days==null?'never visited':`last visit ${esc(p.last)} · ${p.days} days ago`;
 bits.push(`<div class="pp-c">${days}</div>`);
 bits.push(`<div class="pp-c">status: ${esc(STATUS[p.status]||p.status)}</div>`);
 if(x.wqd) bits.push(`<div class="pp-c">E. coli ${x.wq==='Fail'?'<b style="color:#c62828">fail</b>':'pass'} · ${esc(x.wqd)}</div>`);
 const links=[];
 if(x.r) links.push(`<a href="${MWR}${x.r}" target="_blank" rel="noopener">visit record</a>`);
 if(x.q) links.push(`<a href="${MWR}${x.q}" target="_blank" rel="noopener">water-quality result</a>`);
 if(links.length) bits.push(`<div class="pp-l">Open in mWater: ${links.join(' · ')}</div>`);
 bits.push('</div>');
 return bits.join('');
}

 PUMPS.filter(p=>p.site===s).forEach(p=>L.circleMarker([p.lat,p.lon],{radius:p.days==null||p.days>183?6:3,color:'#fff',weight:1,fillColor:col(p),fillOpacity:.95}).bindPopup(()=>popupHtml(p),{maxWidth:280,minWidth:240}).addTo(layer));
 L.marker([R.base[0],R.base[1]]).bindPopup('MadAvance base').addTo(layer);
 const b=L.latLngBounds(PUMPS.filter(p=>p.site===s).map(p=>[p.lat,p.lon]));map.fitBounds(b.pad(.1));
 const ds=document.getElementById('day');ds.innerHTML=R.days.map(d=>`<option value="${d.day}">Day ${d.day} — ${d.stops.length} pumps, ${d.km} km, ${d.hours} h</option>`).join('');}
async function drawDay(s,dayIdx,c){const R=ROUTES[s];const d=R.days[dayIdx];const pts=[[R.base[1],R.base[0]],...d.stops.map(x=>[x.lon,x.lat]),[R.base[1],R.base[0]]];
 d.stops.forEach((x,i)=>L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:`<div style="background:${c};color:#fff;border-radius:10px;padding:1px 5px;font-size:11px;font-weight:600">${d.day}.${i+1}</div>`,iconAnchor:[0,0]})}).addTo(routeLayer));
 try{const j=await fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p.join(',')).join(';')+'?overview=full&geometries=geojson').then(r=>r.json());
  if(j.code==='Ok'){L.geoJSON(j.routes[0].geometry,{style:{color:c,weight:4,opacity:.8}}).addTo(routeLayer);
   // dashed connectors from road to off-road pumps
   j.waypoints.forEach((w,i)=>{const o=pts[i];const dl=Math.hypot(w.location[0]-o[0],w.location[1]-o[1])*111;if(dl>0.2)L.polyline([[o[1],o[0]],[w.location[1],w.location[0]]],{color:c,weight:2,dashArray:'3 4',opacity:.8}).addTo(routeLayer)});
   return}
 }catch(e){}
 L.polyline(pts.map(p=>[p[1],p[0]]),{color:c,weight:2,dashArray:'4 4'}).addTo(routeLayer);}
const QS=new URLSearchParams(location.search);const FIX=QS.get('site');
const ss=document.getElementById('site');
const avail=FIX&&ROUTES[FIX]?[FIX]:Object.keys(ROUTES);
ss.innerHTML=avail.map(s=>`<option>${s}</option>`).join('');
if(FIX&&ROUTES[FIX]){ss.parentElement.style.display='none'}
ss.onchange=()=>{drawSite(ss.value);drawDay(ss.value,0,cols[0])};
document.getElementById('day').onchange=e=>{routeLayer.clearLayers();drawDay(ss.value,+e.target.value-1,cols[0])};
document.getElementById('all').onclick=async()=>{routeLayer.clearLayers();for(let i=0;i<Math.min(5,ROUTES[ss.value].days.length);i++){await drawDay(ss.value,i,cols[i]);await new Promise(r=>setTimeout(r,400))}};
const START=avail[0];ss.value=START;drawSite(START);drawDay(START,0,cols[0]);
