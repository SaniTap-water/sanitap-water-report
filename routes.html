const layer=L.layerGroup().addTo(map);const routeLayer=L.layerGroup().addTo(map);
const cols=['#1f5f8b','#4a3aa7','#1baf7a','#e87ba4','#008300'];
function drawSite(s){layer.clearLayers();routeLayer.clearLayers();const R=ROUTES[s];
 PUMPS.filter(p=>p.site===s).forEach(p=>L.circleMarker([p.lat,p.lon],{radius:p.days==null||p.days>183?6:3,color:'#fff',weight:1,fillColor:col(p),fillOpacity:.95}).bindPopup(`<b>${p.wp}</b><br>${p.fkt}, ${p.commune}<br>last visit: ${p.last||'never'}<br>status: ${p.status}`).addTo(layer));
 L.marker([R.base[0],R.base[1]]).bindPopup('MadAvance base').addTo(layer);
 const b=L.latLngBounds(PUMPS.filter(p=>p.site===s).map(p=>[p.lat,p.lon]));map.fitBounds(b.pad(.1));
 const ds=document.getElementById('day');ds.innerHTML=R.days.map(d=>`<option value="${d.day}">Day ${d.day} — ${d.stops.length} pumps, ${d.km} km, ${d.hours} h</option>`).join('');}
async function drawDay(s,dayIdx,c){const R=ROUTES[s];const d=R.days[dayIdx];const pts=[[R.base[1],R.base[0]],...d.stops.map(x=>[x.lon,x.lat]),[R.base[1],R.base[0]]];
 d.stops.forEach((x,i)=>L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:`<div style="background:${c};color:#fff;border-radius:10px;padding:1px 5px;font-size:11px;font-weight:600">${d.day}.${i+1}</div>`,iconAnchor:[0,0]})}).addTo(routeLayer));
 try{const j=await fetch('https://router.project-osrm.org/route/v1/driving/'+pts.map(p=>p.join(',')).join(';')+'?overview=full&geometries=geojson').then(r=>r.json());
  if(j.code==='Ok'){L.geoJSON(j.routes[0].geometry,{style:{color:c,weight:4,opacity:.8}}).addTo(routeLayer);
   // dashed connectors from road to off-road pumps
   j.waypoints.forEach((w,i)=>{const o=pts[i];const dl=Math.hypot(w.location[0]-o[0],w.location[1]-o[1])*111;if(dl>0.2)L.polyline([[o[1],o[0]],[w.location[1],w.location[0]]],{color:c,weight:2,dashArray:'3 4',opacity:.8}).addTo(routeLayer)});
   return}
 }catch(e){}
 L.polyline(pts.map(p=>[p[1],p[0]]),{color:c,weight:2,dashArray:'4 4'}).addTo(routeLayer);}
const QS=new URLSearchParams(location.search);const FIX=QS.get('site');
const ss=document.getElementById('site');
const avail=FIX&&ROUTES[FIX]?[FIX]:Object.keys(ROUTES);
ss.innerHTML=avail.map(s=>`<option>${s}</option>`).join('');
if(FIX&&ROUTES[FIX]){ss.parentElement.style.display='none'}
ss.onchange=()=>{drawSite(ss.value);drawDay(ss.value,0,cols[0])};
document.getElementById('day').onchange=e=>{routeLayer.clearLayers();drawDay(ss.value,+e.target.value-1,cols[0])};
document.getElementById('all').onclick=async()=>{routeLayer.clearLayers();for(let i=0;i<Math.min(5,ROUTES[ss.value].days.length);i++){await drawDay(ss.value,i,cols[i]);await new Promise(r=>setTimeout(r,400))}};
const START=avail[0];ss.value=START;drawSite(START);drawDay(START,0,cols[0]);
</script></body></html>
